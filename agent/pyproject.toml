[project]
name = "treasury-agent"
version = "0.1.0"
description = "Deepagents-based viewpoint extraction agent service for the OpenNotebook treasury risk analysis system"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.7,<0.8",
    "langchain-openai>=0.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pypdf>=4.0",
    "langfuse>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["."]
